[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-fault-agent"
version = "0.1.0"
description = "A reproducible, evidence-grounded agent for PMSM fault diagnosis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Chen Ying"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
llm = ["openai>=1.30", "langgraph>=0.2"]
onnx = ["onnxruntime>=1.17"]

[project.scripts]
fault-agent = "industrial_fault_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
